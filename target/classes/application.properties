spring.application.name=adaptive-rate-limiter-engine

# Memory is bounded; inactive keys are removed periodically.
rate-limiter.maximum-buckets=100000
rate-limiter.idle-ttl=30m
rate-limiter.cleanup-interval-ms=60000

# Default adaptive token-bucket policy.
rate-limiter.default-policy.capacity=100
rate-limiter.default-policy.initial-rate-per-second=100
rate-limiter.default-policy.minimum-rate-per-second=10
rate-limiter.default-policy.maximum-rate-per-second=1000
rate-limiter.default-policy.target-latency-ms=200
rate-limiter.default-policy.maximum-error-rate=0.05
rate-limiter.default-policy.evaluation-window=50
rate-limiter.default-policy.adaptation-factor=0.20

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
server.tomcat.threads.max=200
server.tomcat.accept-count=1000
